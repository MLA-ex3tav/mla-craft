[package]
name = "mla-craft-server"
version = "0.1.0"
description = "Servidor headless de MLA Server (panel web remoto)"
authors = ["MLA Server"]
edition = "2024"

[[bin]]
name = "mla-craft-server"
path = "src/main.rs"

[dependencies]
mla-craft-core = { path = "../core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
argon2 = "0.5"
rand = "0.8"
rand10 = { package = "rand", version = "0.10" }
russh = { version = "0.64", default-features = false, features = ["ring"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
