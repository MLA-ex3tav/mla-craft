<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/branding/mla-server-ms-stone.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLA Server</title>
    <link rel="stylesheet" href="/startup.css" />
    <link rel="preload" as="image" href="/branding/mla-server-ms-stone.png" />
  </head>
  <body>
    <div id="startup" class="startup" role="status" aria-live="polite" aria-label="MLA Server">
      <div class="startup-stage">
        <!-- Intro scene: creeper walks in, detonates, and the MS emblem emerges.
             Drawn inline so it paints before React mounts; motion is driven by /startup-intro.js. -->
        <svg id="scene" viewBox="0 0 1600 900" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0A140E"/>
              <stop offset="0.55" stop-color="#12271A"/>
              <stop offset="1" stop-color="#1B3A26"/>
            </linearGradient>
            <radialGradient id="horizonGrad" cx="50%" cy="78%" r="65%">
              <stop offset="0" stop-color="#237B4B" stop-opacity="0.28"/>
              <stop offset="1" stop-color="#237B4B" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="78%">
              <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
              <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
            </radialGradient>
            <radialGradient id="logoHaloGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#237B4B" stop-opacity="0.45"/>
              <stop offset="0.45" stop-color="#1B5E3A" stop-opacity="0.28"/>
              <stop offset="1" stop-color="#1B5E3A" stop-opacity="0"/>
            </radialGradient>
            <pattern id="dirtBlock" width="72" height="52" patternUnits="userSpaceOnUse">
              <rect width="72" height="52" fill="#7A5230"/>
              <rect x="0" y="0" width="72" height="2" fill="#0B1710" opacity="0.16"/>
              <rect x="0" y="0" width="2" height="52" fill="#0B1710" opacity="0.16"/>
              <rect x="12" y="14" width="12" height="8" fill="#9E9E9E" opacity="0.16"/>
              <rect x="44" y="34" width="16" height="10" fill="#0B1710" opacity="0.12"/>
              <rect x="26" y="38" width="10" height="6" fill="#8FBF6A" opacity="0.08"/>
            </pattern>
            <pattern id="grassBlock" width="56" height="32" patternUnits="userSpaceOnUse">
              <rect width="56" height="32" fill="#7CB342"/>
              <rect x="0" y="0" width="28" height="8" fill="#8FBF6A" opacity="0.45"/>
              <rect x="28" y="9" width="12" height="8" fill="#237B4B" opacity="0.15"/>
              <rect x="8" y="20" width="9" height="6" fill="#1B5E3A" opacity="0.18"/>
              <rect x="0" y="0" width="2" height="32" fill="#1B5E3A" opacity="0.15"/>
            </pattern>
            <g id="oak">
              <rect x="-11" y="-92" width="22" height="92" fill="#7A5230"/>
              <rect x="3" y="-92" width="8" height="92" fill="#0B1710" opacity="0.25"/>
              <rect x="-11" y="-92" width="5" height="92" fill="#8FBF6A" opacity="0.12"/>
              <rect x="-46" y="-132" width="92" height="28" fill="#1B5E3A"/>
              <rect x="-60" y="-112" width="120" height="32" fill="#237B4B"/>
              <rect x="-38" y="-158" width="76" height="42" fill="#237B4B"/>
              <rect x="-52" y="-100" width="104" height="24" fill="#1B5E3A"/>
              <rect x="-28" y="-152" width="24" height="18" fill="#3E8E5A"/>
              <rect x="12" y="-136" width="22" height="16" fill="#3E8E5A"/>
              <rect x="-54" y="-108" width="18" height="14" fill="#3E8E5A"/>
              <rect x="30" y="-96" width="14" height="10" fill="#1B5E3A"/>
              <rect x="-44" y="-88" width="12" height="10" fill="#1B5E3A"/>
              <rect x="14" y="-158" width="10" height="8" fill="#8FBF6A" opacity="0.55"/>
            </g>
            <g id="bush">
              <rect x="-36" y="-30" width="72" height="30" fill="#1B5E3A"/>
              <rect x="-24" y="-44" width="48" height="20" fill="#237B4B"/>
              <rect x="-38" y="-20" width="26" height="20" fill="#237B4B"/>
              <rect x="14" y="-22" width="26" height="22" fill="#1B5E3A"/>
              <rect x="-16" y="-38" width="14" height="10" fill="#3E8E5A"/>
              <rect x="18" y="-38" width="10" height="8" fill="#3E8E5A"/>
            </g>
          </defs>

          <g id="world">
            <g id="scenery">
              <rect x="-80" y="-80" width="1760" height="1000" fill="url(#skyGrad)"/>
              <ellipse cx="800" cy="720" rx="980" ry="380" fill="url(#horizonGrad)"/>

              <g id="stars" fill="#8FBF6A">
                <rect x="110" y="70" width="3" height="3" opacity="0.3"/>
                <rect x="210" y="140" width="3" height="3" opacity="0.18"/>
                <rect x="330" y="60" width="3" height="3" opacity="0.26"/>
                <rect x="450" y="180" width="3" height="3" opacity="0.2"/>
                <rect x="560" y="90" width="3" height="3" opacity="0.32"/>
                <rect x="690" y="150" width="3" height="3" opacity="0.16"/>
                <rect x="820" y="50" width="3" height="3" opacity="0.3"/>
                <rect x="950" y="130" width="3" height="3" opacity="0.22"/>
                <rect x="1080" y="70" width="3" height="3" opacity="0.28"/>
                <rect x="1200" y="190" width="3" height="3" opacity="0.16"/>
                <rect x="1320" y="90" width="3" height="3" opacity="0.3"/>
                <rect x="1450" y="150" width="3" height="3" opacity="0.2"/>
                <rect x="1540" y="60" width="3" height="3" opacity="0.26"/>
                <rect x="60" y="230" width="3" height="3" opacity="0.17"/>
                <rect x="300" y="260" width="3" height="3" opacity="0.2"/>
                <rect x="720" y="240" width="3" height="3" opacity="0.15"/>
                <rect x="1010" y="260" width="3" height="3" opacity="0.18"/>
                <rect x="1480" y="240" width="3" height="3" opacity="0.22"/>
              </g>

              <g fill="#12291B">
                <rect x="-80" y="628" width="300" height="130"/>
                <rect x="180" y="592" width="260" height="166"/>
                <rect x="410" y="636" width="240" height="122"/>
                <rect x="620" y="600" width="210" height="158"/>
                <rect x="800" y="640" width="250" height="118"/>
                <rect x="1020" y="596" width="230" height="162"/>
                <rect x="1220" y="628" width="260" height="130"/>
                <rect x="1440" y="588" width="240" height="170"/>
              </g>

              <g fill="#0D2115">
                <rect x="560" y="544" width="16" height="96"/>
                <rect x="532" y="520" width="72" height="30"/>
                <rect x="548" y="496" width="40" height="30"/>
                <rect x="1104" y="552" width="14" height="88"/>
                <rect x="1078" y="530" width="66" height="28"/>
                <rect x="1094" y="508" width="34" height="26"/>
                <rect x="862" y="560" width="12" height="80"/>
                <rect x="840" y="540" width="56" height="26"/>
                <rect x="34" y="576" width="14" height="72"/>
                <rect x="10" y="552" width="62" height="28"/>
                <rect x="1470" y="568" width="16" height="76"/>
                <rect x="1444" y="544" width="68" height="28"/>
              </g>

              <use href="#oak" transform="translate(100 700) scale(1.25)"/>
              <use href="#oak" transform="translate(285 700) scale(0.85)"/>
              <use href="#oak" transform="translate(1330 700) scale(1.02)"/>
              <use href="#oak" transform="translate(1515 700) scale(1.3)"/>
              <use href="#bush" transform="translate(460 700) scale(0.9)"/>
              <use href="#bush" transform="translate(1140 700) scale(1.1)"/>
              <use href="#bush" transform="translate(1210 700) scale(0.65)"/>

              <rect x="-80" y="726" width="1760" height="260" fill="url(#dirtBlock)"/>
              <rect x="-80" y="696" width="1760" height="38" fill="url(#grassBlock)"/>
              <rect x="-80" y="728" width="1760" height="6" fill="#1B5E3A" opacity="0.8"/>

              <g fill="#9E9E9E" opacity="0.22">
                <rect x="120" y="790" width="46" height="22"/>
                <rect x="166" y="802" width="26" height="14"/>
                <rect x="352" y="836" width="34" height="18"/>
                <rect x="690" y="812" width="28" height="16"/>
                <rect x="960" y="786" width="52" height="24"/>
                <rect x="1012" y="800" width="24" height="12"/>
                <rect x="1260" y="842" width="40" height="20"/>
                <rect x="1438" y="798" width="30" height="16"/>
              </g>

              <g fill="#7CB342">
                <rect x="52" y="686" width="4" height="12"/>
                <rect x="58" y="682" width="4" height="16"/>
                <rect x="204" y="688" width="4" height="10"/>
                <rect x="248" y="684" width="4" height="14"/>
                <rect x="404" y="688" width="4" height="10"/>
                <rect x="512" y="684" width="4" height="14"/>
                <rect x="588" y="688" width="4" height="10"/>
                <rect x="676" y="685" width="4" height="13"/>
                <rect x="742" y="689" width="4" height="9"/>
                <rect x="928" y="686" width="4" height="12"/>
                <rect x="1044" y="688" width="4" height="10"/>
                <rect x="1168" y="684" width="4" height="14"/>
                <rect x="1282" y="688" width="4" height="10"/>
                <rect x="1396" y="685" width="4" height="13"/>
                <rect x="1540" y="688" width="4" height="10"/>
              </g>
              <g fill="#8FBF6A" opacity="0.55">
                <rect x="140" y="682" width="4" height="16"/>
                <rect x="318" y="686" width="4" height="12"/>
                <rect x="620" y="682" width="4" height="16"/>
                <rect x="892" y="686" width="4" height="12"/>
                <rect x="1246" y="682" width="4" height="16"/>
                <rect x="1462" y="686" width="4" height="12"/>
              </g>
            </g>

            <ellipse id="creeperShadow" cx="-180" cy="700" rx="64" ry="9" fill="#06100A" opacity="0.46"/>
            <g id="dust"></g>
            <g id="creeper" transform="translate(-180 696)"></g>
            <g id="smoke"></g>
            <g id="debris"></g>
          </g>

          <rect x="0" y="0" width="1600" height="900" fill="url(#vignetteGrad)" pointer-events="none"/>
          <rect id="flash" x="0" y="0" width="1600" height="900" fill="#F2FAFF" opacity="0" pointer-events="none"/>

          <g id="logoGroup" opacity="0">
            <ellipse cx="800" cy="455" rx="420" ry="290" fill="url(#logoHaloGrad)"/>
            <g id="logoMark" transform="translate(800 440) scale(1.35) translate(-100 -80)">
              <image href="/branding/mla-server-ms-stone.png" x="-32" y="-52" width="264" height="264" preserveAspectRatio="xMidYMid meet" />
            </g>
          </g>
        </svg>

        <div class="startup-content">
          <p id="startup-label" class="startup-label">Preparando tu mundo…</p>
          <div class="startup-track" role="progressbar" aria-label="Cargando MLA Server"><span></span></div>
        </div>
      </div>
    </div>
    <div id="root" inert></div>
    <script src="/startup-guard.js"></script>
    <script src="/startup-intro.js"></script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
